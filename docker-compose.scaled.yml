# Scaled override — layer on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.scaled.yml up --build
#
# Switches the app to the scaled profile (Postgres + pgvector, Redis-backed
# cache/queue/events, S3 storage) and adds a separate worker process.
services:
  api:
    environment:
      APP_CONFIG: config/scaled.yaml
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analyzer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    # The worker is the process that holds the resident TimesFM model
    # (config/scaled.yaml: forecast.enabled + provider: timesfm), so its image
    # is built with the `forecast` extra (torch + timesfm); the API image is
    # not — API replicas only enqueue forecast jobs. The HuggingFace cache
    # lives on a volume so the checkpoint is downloaded once, not per restart.
    build:
      context: .
      args:
        PROFILE_EXTRAS: "--extra gemini --extra postgres --extra redis --extra storage --extra parse --extra forecast"
    command: ["worker"]
    environment:
      APP_CONFIG: config/scaled.yaml
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/analyzer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      HF_HOME: /app/data/hf
    env_file:
      - path: .env
        required: false
    volumes:
      - hf_cache:/app/data/hf   # pinned TimesFM checkpoint, fetched once
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: analyzer
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

volumes:
  pg_data:
  minio_data:
  hf_cache:
